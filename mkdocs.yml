site_name: MiniDist Tutorial
site_description: A chapter-oriented guide to deterministic replication experiments
site_url: https://system-in-miniature.github.io/mini-dist/
repo_url: https://github.com/system-in-miniature/mini-dist
repo_name: system-in-miniature/mini-dist
docs_dir: docs

theme:
  name: material
  logo: assets/brand/avatar.svg
  favicon: assets/brand/avatar.svg
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - English:
